name: CI

# 每次推 main 和每个 PR 都跑。
# 不在 feature 分支的每次 push 上跑全量 —— 那只会烧 Actions 分钟数，
# 真正需要把关的是"要合进 main 的东西"。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一个 PR 连续推两次，取消第一次：旧 commit 的结果没有意义，
# 而且它还会和新 commit 抢 Docker / 端口。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: 单元与集成测试
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Testcontainers 需要 Docker；ubuntu-latest 自带。
      # DOCKER_API_VERSION 与 pom.xml 里的 docker.api.version 保持一致：
      # 新版 Docker Engine 不再接受旧 API 版本，默认值会报一个没有错误信息的 400。
      - name: mvn verify（65 个测试）
        env:
          DOCKER_API_VERSION: '1.44'
        run: mvn -B -ntp verify

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  smoke:
    name: 镜像构建 + Compose 冒烟
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # 冒烟验的是"镜像 + 配置 + Redis + 端口"这一整套接线，
      # 单测全绿但从未启动过的服务，发布风险并不会更低。
      - name: docker compose up
        run: docker compose up -d --build

      - name: 等待健康检查
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8081/actuator/health | grep -q '"status":"UP"'; then
              echo "网关已就绪（第 ${i} 次探测）"
              exit 0
            fi
            sleep 2
          done
          echo "::error::网关 120 秒内未就绪"
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: 冒烟脚本
        run: bash scripts/smoke.sh

      - name: 失败时导出容器日志
        if: failure()
        run: docker compose logs --no-color

      - name: 清理
        if: always()
        run: docker compose down -v
