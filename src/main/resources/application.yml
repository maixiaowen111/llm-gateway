server:
  # 8080 已被 order-system 占用，网关用 8081
  port: 8081

spring:
  application:
    name: llm-gateway

  # ===== G13：Reactor 上下文自动传播 =====
  # ★ Boot 3.5 的默认值是 limited —— 它【不会】开启 Hooks.enableAutomaticContextPropagation() ★
  #   后果：日志里的 traceId 在异步回调线程上为空。这不是"日志少个字段"，
  #   而是"一次请求的日志无法按 trace 聚合"，出事时排查基本靠猜。
  #   ★ 代价要认：自动传播会给每个算子增加一次上下文存取，高吞吐服务要压测确认。 ★
  reactor:
    context-propagation: auto

  # ===== Redis（G4 新增，限流用）=====
  # ⚠️★ Boot 3 的前缀是 spring.data.redis.*，不是 Boot 2.7 的 spring.redis.* ★
  #    写错了【不会报错】，只是连不上 Redis —— 静默失败，最难查。
  #    项目一（Boot 2.7）就是在同一个坑上栽过一次，所以这里特意留了这段注释。
  #    对应环境变量：SPRING_DATA_REDIS_HOST（不是 SPRING_REDIS_HOST）。
  #    限流启用时，启动自检会 ping 一次 Redis，连不上直接拒绝启动 ——
  #    就是为了让这个"静默失败"变成"响亮的失败"。见 config/RateLimitConfig。
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

# ===== 上游渠道（G1-1d 外置，G3-3b 改成"一张渠道表"）=====
#
# ★ G3b 的结构变化，一句话：
#   从「一个 deepseek: 配置块 → 一个 DeepSeekProvider 类」
#   变成「channels 下面有几项 → 就有几个渠道对象」。
#
#   加第二家厂商的动作 = 在 channels 下面加 4 行。
#   不写 Java 类、不改 Controller、不碰注册表。
#
# 密钥一律走环境变量，冒号后面是默认值（本地开发可以留空，但会被上游 401）。
# ★ 密钥永远不出现在这里、更不进 Git ★
gateway:
  # ===== 客户端鉴权（G10）=====
  #
  # ★ 为什么这一节比限流和计费更重要 ★
  #   限流和计费都按 clientId 归属。在鉴权之前，clientId 来自 X-Client-Id ——
  #   一个客户端自己填的字符串。也就是说：**限流可以被绕过（每次换个 ID），
  #   计费可以被嫁祸（填别人的 ID 花别人的钱）**。
  #   身份先被证明，限流和计费才成立。
  #
  # ★ 密钥怎么配 ★
  #   格式：clientId:sha256Hex，多把用逗号分隔（环境变量里不能写 YAML 列表）。
  #   生成摘要：printf '%s' '你的key' | sha256sum
  #   ⚠️ 配置里【只放摘要】，明文 key 只发给客户端一次，永不落盘。
  #   同一个 clientId 可以配多把 key —— 那是密钥轮换：新旧并存，换完再删旧的。
  auth:
    # ⚠️ 默认 false 不是"忘了打开"，是本地开发不需要。关着时启动会打 WARN，
    #    明确告诉你"当前信任 X-Client-Id"。生产必须打开。
    enabled: ${GATEWAY_AUTH_ENABLED:false}
    # 逗号分隔的 clientId:sha256。示例 key 是开发用的演示值，
    # ★ 任何真实部署都必须换掉 ★（它已经写在本仓库里，等于公开）。
    keys: ${GATEWAY_AUTH_KEYS:}

  # ===== 渠道运行期状态（G11）=====
  #
  # 单实例（默认 local）：管理员摘掉的渠道只对当前实例生效。
  # 多实例（redis）：状态写 Redis + Pub/Sub 通知所有实例，路由仍读本地缓存。
  #
  # ★ 为什么默认 local，而不是"检测到多实例自动切 redis" ★
  #   自动检测需要服务发现/实例注册，那是另一套基础设施；猜错的后果是
  #   "以为同步了、其实各写各的"。宁可默认最保守，由部署方显式声明。
  channel-state:
    mode: ${GATEWAY_CHANNEL_STATE_MODE:local}
    key-prefix: ${GATEWAY_CHANNEL_STATE_KEY_PREFIX:gw:channel-state}
    # 启动拉快照 / 单次写入超时。运行期读本地缓存，不受它影响
    timeout-millis: ${GATEWAY_CHANNEL_STATE_TIMEOUT_MILLIS:300}

  providers:
    # 客户端没指定渠道时走哪个。名字必须是下面 channels 里的某一个 key，
    # 否则应用启动就会失败（ProviderRegistry 的 fail-fast，3a 就有）。
    default-channel: ${GATEWAY_DEFAULT_CHANNEL:deepseek}

    channels:
      deepseek:
        # type 决定用哪个 Provider 实现：openai = OpenAI 兼容协议
        type: openai
        base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
        api-key: ${DEEPSEEK_API_KEY:}
        model: ${DEEPSEEK_MODEL:deepseek-chat}
        # ---------- G6 新增的三个字段 ----------
        # group：故障转移的边界。**只在同组内转移** —— 把订单流量转到客服模型上，
        #        比直接 503 更糟（用户拿到一个看似正常、实际完全不对的答案）。
        group: default
        # weight：平滑加权轮询的权重。0 = 不参与自动路由，但仍可被显式指定。
        weight: 5
        # models：这个渠道"认领"哪些模型名。请求里的 model 命中它就优先走它。
        models:
          - deepseek-chat
          - deepseek-reasoner

      # 第二家渠道（G3b 新增）。
      # ★ 注意这里没有对应的 Java 类 —— 它复用 OpenAiCompatibleProvider。
      #   这就是"一个实现类 × N 份配置"：Moonshot 也是 OpenAI 兼容协议，
      #   差异只有 base-url / api-key / model 三样，写类是没有意义的重复。
      moonshot:
        type: openai
        base-url: ${MOONSHOT_BASE_URL:https://api.moonshot.cn/v1}
        api-key: ${MOONSHOT_API_KEY:}
        model: ${MOONSHOT_MODEL:moonshot-v1-8k}
        group: default
        weight: 1
        models:
          - moonshot-v1-8k
          - moonshot-v1-32k

      # ★ G3c：协议真的不同的第三家。它必须有自己的 Provider 实现类。
      #   和上面两个的差别不是"地址/key 不同"，而是**请求体和响应体长什么样都不同**：
      #   - 鉴权头 x-api-key + anthropic-version（不是 Authorization: Bearer）
      #   - system 消息是顶层字段（不是 messages[0]）
      #   - max_tokens 必填（OpenAI 协议里可选）
      #   - 流式事件是 event: content_block_delta（不是纯 data: JSON）
      #   这几条**没有一条能用配置表达** —— 这就是 Provider 抽象存在的证据。
      #
      #   放在单独分组：它和 deepseek 不是一个协议，自动路由不应把它当成备份。
      anthropic:
        type: anthropic
        base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
        api-key: ${ANTHROPIC_API_KEY:}
        model: ${ANTHROPIC_MODEL:claude-sonnet-5}
        group: claude
        weight: 1
        # Anthropic 的 max_tokens 必填；客户端没传时用这个值兜底
        max-tokens: ${ANTHROPIC_MAX_TOKENS:1024}
        models:
          - claude-sonnet-5

    # ===== 路由策略（G6）=====
    routing:
      # ⚠️★ 默认 false，为了让升级是"行为兼容"的 ★
      # 老客户端不传 provider 时，过去永远走 default-channel；打开自动路由后，
      # 同样的请求可能被权重分到另一条渠道 —— 这是行为变更，不能悄悄发生。
      # 想启用加权路由，显式把它打开（或在请求里传 provider=auto）。
      auto-route: ${GATEWAY_AUTO_ROUTE:false}
      # 故障转移总开关。关掉后请求绝不会"悄悄跑到另一家厂商"——
      # 合规/对账场景宁愿 503 也不能走错渠道。
      failover-enabled: ${GATEWAY_FAILOVER_ENABLED:true}
      # 显式点名某渠道失败时，允不允许在同组里转移？
      # true = 可用性优先（用户这次能成）；false = 严格服从点名（账单/合规场景）。
      failover-on-explicit: ${GATEWAY_FAILOVER_ON_EXPLICIT:true}
      strategy: smooth-weighted

  # ===== 熔断与重试（G5）=====
  # 每个渠道一个熔断器 —— 一个上游的故障不能放大成全部上游的故障。
  resilience:
    enabled: ${GATEWAY_RESILIENCE_ENABLED:true}
    # 失败率阈值（%）。只有超时/5xx/429 计入失败；400/401 不计数（避免误伤）
    failure-rate-threshold: ${GATEWAY_CB_FAILURE_RATE:50}
    sliding-window-size: ${GATEWAY_CB_WINDOW:10}
    minimum-number-of-calls: ${GATEWAY_CB_MIN_CALLS:5}
    # 打开后等 10 秒进入半开，放 2 个请求探路
    wait-duration-in-open-state-millis: ${GATEWAY_CB_OPEN_WAIT_MS:10000}
    permitted-number-of-calls-in-half-open-state: ${GATEWAY_CB_HALF_OPEN_CALLS:2}
    # 同渠道重试次数（不含第一次）。默认 0：先证明"转移渠道"够用，
    # 再决定要不要重试 —— 重试会放大上游压力，不是免费的。
    max-retry-attempts: ${GATEWAY_RETRY_MAX_ATTEMPTS:1}
    retry-backoff-millis: ${GATEWAY_RETRY_BACKOFF_MS:200}

  # ===== 计费（G7）=====
  # 一句话：请求前按"最坏情况"预扣，成功后按真实 usage 多退少补；
  #         一个字没吐就失败 → 全额退；吐了一半断开 → 按预扣额度收费。
  # ★ 所有扣钱动作都在 Lua 脚本里（resources/scripts/billing_*.lua），Java 只负责算金额和翻译错误。★
  billing:
    # ⚠️ 默认 false，理由和限流一样：打开它意味着网关多了一个必须活着的依赖。
    #   关着时启动会打 WARN；打开时启动自检连不上 Redis 会直接拒绝启动。
    #   ★ 生产必须打开 —— 否则等于免费替所有人调用大模型，而且没人会发现。★
    enabled: ${GATEWAY_BILLING_ENABLED:false}

    # Redis 不可用时：true=放行但不计费（WARN），false=拒绝（503，默认）。
    # ★ 和限流的默认值【相反】★：限流失效只是"可能超卖"，计费失效是"账目无法对账"。
    #   宁可短时间不可用，也不能产生收不回来的钱。
    fail-open: ${GATEWAY_BILLING_FAIL_OPEN:false}

    # 新客户端首次预扣时自动发放的试用额度。真实系统里应由账户系统充值。
    # 这里给得比较宽松，是为了让本地演示能跑通；生产上通常设为 0 或很小的值。
    initial-credits: ${GATEWAY_BILLING_INITIAL_CREDITS:1000000}

    # 单价（credits / token）。输出通常比输入贵，所以默认 1 : 3。
    prompt-token-credits: ${GATEWAY_BILLING_PROMPT_TOKEN_CREDITS:1}
    completion-token-credits: ${GATEWAY_BILLING_COMPLETION_TOKEN_CREDITS:3}

    # 客户端没传 max_tokens 时，预扣按这个上限估算。
    # ⚠️ 这个值不能设得太大：它是"最坏情况"的预扣额，设成 128k 会让小额用户寸步难行。
    default-max-tokens: ${GATEWAY_DEFAULT_MAX_TOKENS:1024}

    # 预扣凭据的 TTL（秒）。防泄漏：网关崩溃时，没人结算的预扣会自动释放。
    reservation-ttl-seconds: ${GATEWAY_BILLING_RESERVATION_TTL_SECONDS:1800}

    # 单次 Redis 调用超时（毫秒）。理由同限流器：Lettuce 默认 60 秒会把网关拖死。
    # ⚠️ 键名跟着 Java 字段名 timeoutMillis 走，写 timeout-ms 会绑定失败（静默取 0）。
    timeout-millis: ${GATEWAY_BILLING_TIMEOUT_MILLIS:300}

    # 多环境共用 Redis 时必须隔离，否则测试环境的消耗会记到生产用户头上。
    key-prefix: ${GATEWAY_BILLING_KEY_PREFIX:gw:billing}

  # ===== 管理接口（G6）=====
  # ⚠️ 名字必须是 admin.token；不配置时 /admin/** 一律 403（fail-closed）。
  #   生产上请用密钥管理系统注入，并只在内网暴露这个路径。
  admin:
    token: ${GATEWAY_ADMIN_TOKEN:}

  # ===== 上游超时（G1-1d）=====
  upstream:
    # ① 连接超时：TCP 三次握手的最长时间。
    #    对端 IP 存在但一直不回 SYN 时，没有它请求会永远挂住。
    connect-timeout-ms: ${GATEWAY_CONNECT_TIMEOUT_MS:3000}
    # ② 读超时：从请求发出到收到响应头的总时长。
    #    1d 只做非流式，所以它等价于"读完整个响应"。
    #    ★ G2-2d 的结论：上了流式之后它仍然有用，但只管到「响应头」为止 ——
    #      流式响应头几十毫秒就回来了，之后吐多久它都管不到。
    #      中途卡死由下面的 ③ 兜住。两条腿都要有，缺一个都有洞。
    read-timeout-ms: ${GATEWAY_READ_TIMEOUT_MS:30000}
    # ③ 逐块空闲超时（G2-2d 新增）：量的是"两个数据块之间最长允许隔多久"。
    #    它不是"整条流最多活多久"——健康的长回复（比如吐 5 分钟）不该被杀，
    #    只有"卡住不动"才该杀。所以取 20s：正常模型不会 20 秒吐不出一个字，
    #    真卡住了 20 秒也足够判定死亡。
    #    ⚠️ 这个值不能照着 ① 连接超时抄（3s）—— 模型思考时停顿几秒是正常的，
    #      设太小会把健康的长回复杀掉，那是比超时更严重的生产事故。
    #
    #    ★ G3b 注意：这个值是**所有渠道共用**的，由 ProviderConfig 统一注入。
    #      等真的遇到"某家模型特别爱思考"的问题，再把它挪进每个 channel 里。
    #      **现在不挪，是因为还没有证据说明需要 —— 配置项要为真实需求而加。**
    idle-timeout-ms: ${GATEWAY_IDLE_TIMEOUT_MS:20000}

  # ===== 限流（G4）=====
  #
  # 一句话：capacity 决定"能突发多少"，refill-per-second 决定"长期平均多快"。
  # 这两件事是分开的业务需求，令牌桶用两个旋钮表达它们（固定窗口只有一个）——
  # 这就是选令牌桶而不是"每分钟 N 次"的原因。
  rate-limit:
    # ⚠️★ 默认 false —— 这是刻意的取舍，不是忘了打开 ★
    # 打开它意味着网关多了一个【必须活着】的外部依赖。默认打开的话，
    # 一个没起 Redis 的环境连启动都起不来 —— 而"起不来"和"没限流"之间，
    # 我们要的是后者【能被看见】，而不是前者把人挡在门外。
    # 所以：默认关，但关着时启动会打一条 WARN；一旦打开，
    # 启动时必须真的连得上 Redis，否则拒绝启动。三条路都有明确的表达。
    enabled: ${GATEWAY_RATE_LIMIT_ENABLED:false}

    # 桶容量：单个客户端最多能"先花未来"多少个请求 = 允许的突发量。
    capacity: ${GATEWAY_RATE_LIMIT_CAPACITY:20}

    # 回填速度（令牌/秒）= 长期平均吞吐。
    # 填 0 表示【不回填】—— 那就成了一个"一次性总配额"，等多久都没用。
    # ⚠️ 这个值不能照着 capacity 抄：capacity=20 / refill=20 意味着
    #    "允许 20 个突发，然后持续每秒 20 个" —— 长期速率其实一点没限住。
    #    典型的搭配是 capacity 远大于 refill-per-second（比如 20 和 1）。
    refill-per-second: ${GATEWAY_RATE_LIMIT_REFILL_PER_SECOND:10}

    # Redis 抖动/变慢时怎么办：true=放行（可用性优先），false=拒绝（返回 503）。
    # ★ 这个默认值是一条【业务判断】，不是技术判断：大模型按 token 花钱，
    #   所以"成本优先"在某些公司是硬要求，那种场景应该改成 false。
    #   我们默认 true，理由是"保护性组件的失败不该升级成网关的失败"。
    #   真正错的做法是把它写死 —— 那等于替业务做了一个它没参与的决定。
    fail-open: ${GATEWAY_RATE_LIMIT_FAIL_OPEN:true}

    # 单次 Redis 调用的超时。
    # ⚠️★ 这个值不设会出大事：Lettuce 的默认命令超时是 60 秒 ★
    #   Redis "变慢"（持久化、网络丢包重传）时，每个请求会卡 60 秒，
    #   网关的并发能力被瞬间吃干 —— 【那比限流失效严重得多】：
    #   限流器把网关自己拖死了。"挂掉"fail-open 能兜住，"变慢"只有超时能兜住。
    #
    # ⚠️⚠️★ 这里为什么写 millis 而不是 ms —— 本项目真踩过，写清楚免得再踩 ★⚠️⚠️
    #   Java 侧的字段名叫 timeoutMillis，Spring 的【宽松绑定】把它归一化成 "timeoutmillis"。
    #   归一化的规则是"小写 + 去掉分隔符"，它【不会把 ms 展开成 millis】——
    #   所以写成 timeout-ms 时，归一化得到的是 "timeoutms"，和 "timeoutmillis" 对不上。
    #   对不上的后果不是报错，是【这个键被整个忽略】，long 字段拿到默认值 0。
    #   ★ 同一个前缀下的 capacity / refill-per-second / key-prefix / fail-open 全都绑得上，
    #     唯独 timeout-ms 绑不上 —— 于是问题看起来像"YAML 缩进错了"，其实缩进完全正确。 ★
    #   两个办法都行，选哪个都比"静默取 0"好：
    #     ① 键名跟着 Java 字段名走（这里选的，因为字段名本身是清楚的）；
    #     ② 或者把 Java 字段改名成 timeoutMs（但不符合本项目"长整型字段带单位后缀"的惯例）。
    #   ③ 更根本的一层：给 @ConfigurationProperties 加 ignoreUnknownFields = false，
    #      让"拼错的键"直接变成一个启动失败 —— 见 RateLimitConfig 的注释。
    timeout-millis: ${GATEWAY_RATE_LIMIT_TIMEOUT_MILLIS:200}

    # key 前缀。多环境共用一个 Redis 时必须隔离，
    # 否则测试环境压测的流量会吃掉生产环境的额度（而且两边都一脸茫然）。
    key-prefix: ${GATEWAY_RATE_LIMIT_KEY_PREFIX:gw:rl}

# ===== 观测（G9）=====
#
# ★ 为什么暴露的端点要"列出来"，而不是 include: "*" ★
# actuator 的端点里有些是【能改变系统状态】的（shutdown、env、heapdump）。
# include: "*" 会在某次 Boot 升级后悄悄把新端点也暴露出去 ——
# 而暴露面的变化不应该取决于依赖版本。
management:
  # ===== G13：链路追踪 =====
  # 一次请求会经过：客户端 → 网关 → 上游模型。没有 traceId 时，
  # "用户说慢" 和 "上游说没收到请求" 只能靠时间戳猜。
  # ★ 采样率默认 1.0 是【本地/演示】取值；生产按 QPS 调低（1%~10%），
  #   否则 span 的存储成本会超过业务本身。★
  tracing:
    enabled: ${GATEWAY_TRACING_ENABLED:true}
    sampling:
      probability: ${GATEWAY_TRACE_SAMPLING:1.0}
  otlp:
    tracing:
      # OTLP/HTTP 端点。collector 不在时导出会失败并打 WARN，
      # 但【不影响请求】—— 追踪是旁路，不能反过来拖垮业务。
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # ★ 只要这个网关不对公网裸露 8081，details 是排障时的第一现场 ★
      #   如果暴露在公网，改成 when-authorized 并接上鉴权。
      show-details: always
      probes:
        enabled: true
  health:
    redis:
      # ★ 关掉 Boot 自带的 Redis 探活，改用我们自己的（见 ProtectionDependencyHealthIndicator）★
      #   Boot 的版本是"只要 Redis 在 classpath 上就探活"，于是一个
      #   【根本没开限流、没开计费】的本地实例会因为没起 Redis 而整体 health=DOWN；
      #   而把它整个关掉，又会让"限流开着但 Redis 挂了"的生产故障被健康检查无视。
      #   正确做法不是二选一，而是按依赖关系判断：我们的 indicator 只在
      #   rate-limit 或 billing 启用时才把 Redis 当依赖。
      enabled: false
  metrics:
    tags:
      # 多服务共用一个 Prometheus 时，没有 application 标签就无法区分数据属于谁
      application: ${spring.application.name}

logging:
  level:
    io.github.maixiaowen.gateway: INFO
  # 用 json profile 启动即可切换成结构化日志：SPRING_PROFILES_ACTIVE=json
  # （格式定义见 logback-spring.xml；默认仍是人类可读的单行）
